[project]
name = "concept-transformer-assessment"
version = "0.1.0"
description = "Step-by-step reproduction of the IBM Concept Transformer assessment"
requires-python = "==3.8.*"
# Model dependencies match the upstream requirements.txt.
# The README pins NumPy 1.20.3; requirements.txt pins 1.22.0, which we use.
# Upstream leaves epyc unpinned; we select 1.7.2 for reproducibility.
dependencies = [
    "torch==1.10.0",
    "torchvision==0.11.1",
    "pytorch-lightning==1.4.8",
    "lightning-bolts==0.3.4",
    "torchmetrics==0.5.0",
    "scipy==1.7.1",
    "numpy==1.22.0",
    "pandas==1.3.3",
    "setuptools==59.5.0",
    "albumentations==1.0.3",
    "timm==0.4.12",
    "matplotlib==3.5.1",
    "epyc==1.7.2",
    # Transitive compatibility pins for the older augmentation/logging stack.
    "opencv-python-headless==4.5.5.64",
    "scikit-image==0.19.3",
    "pillow==9.5.0",
    "protobuf==3.20.3",
    # Notebook and logging tools compatible with Python 3.8.
    "tensorboard==2.11.2",
    "jupyterlab==3.6.8",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "nbformat==5.10.4",
    "nbclient==0.9.0",
    "tomli==2.0.1",
    "pip==24.0",
]

[tool.uv]
package = false
