[project]
name = "concept-transformer-assessment"
version = "0.1.0"
description = "Step-by-step reproduction of the IBM Concept Transformer assessment"
requires-python = "==3.8.*"
# Scientific/model dependencies retain upstream pins; the GPU runtime is updated for L4.
# The README pins NumPy 1.20.3; requirements.txt pins 1.22.0, which we use.
# Upstream leaves epyc unpinned; we select 1.7.2 for reproducibility.
dependencies = [
    "torch==2.0.1+cu118",
    "torchvision==0.15.2+cu118",
    "pytorch-lightning==1.9.5",
    "lightning-bolts==0.7.0",
    "torchmetrics==0.11.4",
    "scipy==1.7.1",
    "numpy==1.22.0",
    "pandas==1.3.3",
    "setuptools==59.5.0",
    "albumentations==1.0.3",
    "timm==0.4.12",
    "matplotlib==3.5.1",
    "epyc==1.7.2",
    # Transitive compatibility pins for the older augmentation/logging stack.
    "opencv-python-headless==4.5.5.64",
    "scikit-image==0.19.3",
    "pillow==9.5.0",
    "protobuf==3.20.3",
    # Notebook and logging tools compatible with Python 3.8.
    "tensorboard==2.11.2",
    "jupyterlab==3.6.8",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "nbformat==5.10.4",
    "nbclient==0.9.0",
    "tomli==2.0.1",
    "pip==24.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Install the matched CUDA runtime wheels, also usable on CPU-only nodes.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
